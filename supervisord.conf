; supervisord — менеджер процессов внутри самодостаточного образа all-in-one.
; Запускает: Ollama (локальная LLM) -> backend (Fastify) -> frontend (Vite).

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:ollama]
command=/usr/local/bin/ollama serve
; Ollama не имеет аутентификации, поэтому слушаем только loopback:
; backend в этом же контейнере ходит на http://127.0.0.1:11434
environment=OLLAMA_HOST="127.0.0.1:11434"
autostart=true
autorestart=true
stdout_logfile=/var/log/ollama.log
stderr_logfile=/var/log/ollama.err.log
priority=10

[program:backend]
command=pnpm --filter @recon/backend start
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/backend.log
stderr_logfile=/var/log/backend.err.log
priority=20

[program:frontend]
command=pnpm --filter @recon/frontend dev -- --host 0.0.0.0 --port 3000
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/frontend.log
stderr_logfile=/var/log/frontend.err.log
priority=30

# Reconciliation AI — локальный запуск с Ollama (или OpenRouter)
#
# Вариант A (рекомендуемый): у вас УЖЕ стоит Ollama на хосте.
#   AI_PROVIDER=ollama docker compose up backend frontend
#   В .env: OLLAMA_BASE_URL=http://host.docker.internal:11434
#
# Вариант B: всё в одном — Docker поднимет свой контейнер Ollama:
#   cp .env.example .env  (проверьте: AI_PROVIDER=ollama, OLLAMA_BASE_URL=http://ollama:11434)
#   docker compose --profile with-ollama up -d --build
#   docker compose exec ollama ollama pull qwen2.5:7b-instruct   # ОБЯЗАТЕЛЬНО: скачайте модель
#   Затем откройте http://localhost:5173

services:
  # --- САМОДОСТАТОЧНЫЙ ALL-IN-ONE (Вариант C) --------------------------------
  # Один образ = Ollama + модель внутри + backend + frontend. Секретов нет.
  #   docker compose --profile allinone up -d --build
  #   Открыть http://localhost:5173
  # Модель уже запечена — никаких ollama pull делать не нужно.
  allinone:
    build:
      context: .
      dockerfile: Dockerfile.allinone
    container_name: recon-allinone
    profiles: ["allinone"]
    ports:
      - "5173:5173"   # frontend (основной вход)
      - "5057:5057"   # backend API напрямую (опционально)
    restart: unless-stopped
    # GPU на мощной машине — раскомментируйте (потребуется NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]

  ollama:
    image: ollama/ollama:latest
    container_name: recon-ollama
    profiles: ["with-ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama   # модели сохраняются между перезапусками
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]   # GPU, если есть (NVIDIA); без него — CPU

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: recon-backend
    ports:
      - "5057:5057"
    env_file:
      - .env
    environment:
      # Внутри сети compose Ollama доступна по имени сервиса;
      # для Ollama на хосте задайте в .env: OLLAMA_BASE_URL=http://host.docker.internal:11434
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # доступ к Ollama на хосте (Linux)
    volumes:
      - ./backend/src:/app/backend/src        # hot-reload при dev-режиме
    depends_on: []
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: recon-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5057
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama-data:
